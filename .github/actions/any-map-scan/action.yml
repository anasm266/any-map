name: any-map scan
description: Run the any-map CLI against a TypeScript project (thresholds optional)

inputs:
  working-directory:
    description: Directory containing tsconfig.json
    required: false
    default: "."
  version:
    description: npm dist-tag or version for any-map (e.g. latest)
    required: false
    default: "latest"
  args:
    description: Extra CLI arguments (e.g. --fail-above 10 --fail-coverage 80)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --yes any-map@${{ inputs.version }} scan . ${{ inputs.args }}
